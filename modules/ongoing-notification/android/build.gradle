plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ongoingnotification'
version = '0.1.0'

android {
  namespace "expo.modules.ongoingnotification"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Bildirim düzenindeki TextAppearance.Compat.Notification stilleri buradan gelir (release'te kaynak doğrulaması ister)
  implementation 'androidx.core:core:1.13.1'
}
